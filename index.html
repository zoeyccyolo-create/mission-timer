<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>任務計時器 · 30:00</title>
<style>
  :root{
    --accent:#1e9df1;
    --accent-hi:#38adff;
    --ink:#f2f7ff;
    --muted:#8494a8;
    --chip-line:rgba(180,205,235,.26);
    --btn-face:#232b3a;
    --btn-line:rgba(255,255,255,.09);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Roboto Mono", monospace;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:#02040b;
    color:var(--ink);
    font-family:var(--mono);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  #sky{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0; }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }

  /* ── 星球切換列 ── */
  .planets{
    position:fixed;
    top:0; left:0; right:0;
    z-index:2;
    display:flex;
    justify-content:flex-end;
    gap:8px;
    padding:20px 26px;
    flex-wrap:wrap;
  }
  .chip{
    font-family:inherit;
    font-size:13px;
    letter-spacing:.12em;
    padding:9px 20px 9px 22px;
    border-radius:999px;
    border:1px solid var(--chip-line);
    background:rgba(10,18,32,.35);
    color:#b9c6d8;
    cursor:pointer;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    transition:background .18s ease, color .18s ease, border-color .18s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .chip:hover{ border-color:rgba(200,225,255,.5); color:#e2ecf8; }
  .chip[aria-selected="true"]{
    background:#eef4fb;
    border-color:#eef4fb;
    color:#101821;
    font-weight:600;
  }
  .chip:focus-visible{ outline:2px solid var(--accent-hi); outline-offset:3px; }

  /* ── 主區 ── */
  main{
    position:relative;
    z-index:1;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:12vh 24px 40vh;
  }

  .clock{
    font-size:clamp(3.4rem, 13.5vw, 9rem);
    font-weight:600;
    line-height:1;
    letter-spacing:.07em;
    padding-left:.07em;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
    text-align:center;
    color:#fff;
    text-shadow:0 0 60px rgba(120,190,255,.25);
    transition:color .3s ease;
  }
  body.is-done .clock{ color:var(--accent-hi); text-shadow:0 0 60px rgba(56,173,255,.4); }

  .sun{
    margin:clamp(14px,2.8vh,28px) 0 0;
    font-size:13px;
    letter-spacing:.18em;
    padding-left:.18em;
    color:var(--muted);
    text-align:center;
    min-height:1em;          /* 先佔位，資料回來時不會把版面推動 */
  }

  .progress{
    width:min(600px, 84vw);
    margin-top:clamp(30px,6vh,60px);
  }
  .track{
    position:relative;
    height:3px;
    background:rgba(180,205,235,.16);
    border-radius:3px;
  }
  .fill{
    position:absolute; left:0; top:0; bottom:0;
    width:0%;
    background:var(--accent);
    border-radius:3px;
    box-shadow:0 0 14px rgba(30,157,241,.55);
  }
  .rocket{
    position:absolute;
    top:50%; left:0;
    width:30px; height:30px;
    transform:translate(-50%,-50%);
  }
  .rocket svg{ display:block; width:100%; height:100%; overflow:visible; }
  .flame{ opacity:0; transform-origin:7px 12px; }
  body.is-running .flame{ animation:burn .26s steps(2,end) infinite; }
  @keyframes burn{
    0%   { opacity:1;   transform:scaleX(1); }
    100% { opacity:.45; transform:scaleX(.55); }
  }

  .ends{
    display:flex;
    justify-content:space-between;
    margin-top:14px;
    font-size:13px;
    letter-spacing:.18em;
    color:var(--muted);
  }

  .controls{
    display:flex;
    gap:14px;
    margin-top:clamp(34px,6.5vh,66px);
    flex-wrap:wrap;
    justify-content:center;
  }
  .btn{
    font-family:inherit;
    font-size:17px;
    font-weight:600;
    letter-spacing:.16em;
    padding:19px 40px 19px 46px;
    border-radius:28px;
    border:1px solid var(--btn-line);
    cursor:pointer;
    transition:transform .12s ease, background .18s ease, opacity .18s ease, color .18s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{ transform:translateY(1px); }
  .btn:focus-visible{ outline:2px solid var(--accent-hi); outline-offset:3px; }

  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    box-shadow:0 14px 40px -14px rgba(30,157,241,.9);
  }
  .btn.primary:hover{ background:var(--accent-hi); }

  .btn.ghost{
    background:rgba(35,43,58,.84);
    color:#c3cedd;
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
  }
  .btn.ghost:hover{ background:rgba(43,52,72,.92); color:#e3ebf6; }

  .btn[disabled]{ opacity:.5; cursor:default; transform:none; box-shadow:none; }

  @media (max-width: 640px){
    .planets{ justify-content:center; padding:14px 12px; gap:6px; }
    .chip{ font-size:12px; padding:7px 14px 7px 16px; }
    .btn{ font-size:15px; padding:16px 26px 16px 31px; }
    main{ padding:16vh 18px 36vh; }
  }

  @media (prefers-reduced-motion: reduce){
    body.is-running .flame{ animation:none; opacity:.85; }
    .btn,.chip{ transition:none; }
  }
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>

<nav class="planets" id="planets" role="tablist" aria-label="目的地星球">
  <button class="chip" type="button" role="tab" data-planet="mars"    aria-selected="true">火星</button>
  <button class="chip" type="button" role="tab" data-planet="earth"   aria-selected="false">地球</button>
  <button class="chip" type="button" role="tab" data-planet="moon"    aria-selected="false">月球</button>
  <button class="chip" type="button" role="tab" data-planet="jupiter" aria-selected="false">木星</button>
  <button class="chip" type="button" role="tab" data-planet="saturn"  aria-selected="false">土星</button>
</nav>

<main>
  <div id="clock" class="clock" role="timer" aria-live="off">30:00</div>
  <p id="status" class="sr-only" aria-live="polite">待機中</p>
  <p id="sun" class="sun"></p>

  <div class="progress">
    <div class="track" id="track" role="progressbar" aria-label="任務進度"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="fill" id="fill"></div>
      <div class="rocket" id="rocket">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path class="flame" d="M6.6 12 L1.2 9.3 L3.2 12 L1.2 14.7 Z" fill="#38adff"/>
          <path d="M11 6.6 L8.2 2.6 L7.4 8.8 Z" fill="#1e9df1"/>
          <path d="M11 17.4 L8.2 21.4 L7.4 15.2 Z" fill="#1e9df1"/>
          <path d="M5.8 12 L11 6.7 L16 6.7 C19.6 6.7 22 9.1 22 12 C22 14.9 19.6 17.3 16 17.3 L11 17.3 Z"
                fill="#eaf4ff"/>
          <circle cx="16.6" cy="12" r="1.9" fill="#0b1220"/>
        </svg>
      </div>
    </div>
    <div class="ends"><span>啟程</span><span>抵達</span></div>
  </div>

  <div class="controls">
    <button id="btnStart" class="btn primary" type="button">發射</button>
    <button id="btnPause" class="btn ghost" type="button">待機</button>
    <button id="btnReset" class="btn ghost" type="button">返航</button>
  </div>
</main>

    0.556,0.331,0.6,0.30,  0.578,0.589,0.9,0.44,  0.599,0.171,0.7,0.34,  0.621,0.471,1.1,0.59,
    0.643,0.284,0.6,0.31,  0.664,0.694,0.8,0.41,  0.686,0.418,0.9,0.48,  0.708,0.148,0.7,0.33,

    0.902,0.266,0.9,0.47,  0.924,0.658,0.7,0.33,  0.946,0.211,1.0,0.50,  0.962,0.541,0.6,0.31,
    0.978,0.328,0.8,0.39,  0.994,0.128,0.9,0.46
  ];
  var STAR_BAND = 0.95;

  /* ───────── 星球設定：外觀 + 各自的任務時長 ───────── */
  var PLANETS = {
    mars:{
      label:'火星', minutes:30,
      ramp:[[28,10,6],[96,40,20],[198,106,54],[255,216,180]],
      halo:'255,146,88', limb:'255,190,144',
      body:['#0a0402','#180a05'], bands:0.05, spin:0.0000068
    },
    earth:{
      label:'地球', minutes:25,
      ramp:[[6,14,34],[26,70,122],[94,178,218],[228,246,255]],
      halo:'110,186,255', limb:'150,214,255',

    },
    moon:{

      ramp:[[11,12,15],[54,56,63],[138,142,152],[242,244,250]],
      halo:'176,190,208', limb:'220,228,240',

    },
    jupiter:{
      label:'木星', minutes:45,
      ramp:[[26,16,8],[106,68,34],[208,158,96],[255,240,208]],

    },
    saturn:{

      body:['#0a0803','#1b1509'], bands:0.16, spin:0.0000115
    }
  };
  var current = 'mars';

  /* ───────── 星球幾何 ───────── */
  var cvs = document.getElementById('sky');
  var ctx = cvs.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var cx = 0, cy = 0, R = 1;
  var ARC = 0.42;              // 地平線露出畫面下方多少高度
  var TILT = 76 * Math.PI/180; // 自轉軸傾角，讓可見帶落在中緯度
  var ROLL = -0.10;            // 地平線微傾
  var CA = Math.cos(TILT), SA = Math.sin(TILT);
  var CR = Math.cos(ROLL), SR = Math.sin(ROLL);

  // 光源在左上（螢幕座標 y 向上為正）
  var LX = -0.52, LY = 0.62, LZ = 0.59;
  (function(){ var n = Math.sqrt(LX*LX+LY*LY+LZ*LZ); LX/=n; LY/=n; LZ/=n; })();

  var LAT_STEP = 1.15, LON_STEP = 1.25;
  var LAT = [], LON = [];
  (function build(){
    for (var la = -88; la <= 88; la += LAT_STEP){
      var r = la * Math.PI/180;
      LAT.push(Math.cos(r), Math.sin(r), r);
    }
    for (var lo = 0; lo < 360; lo += LON_STEP){
      var t = lo * Math.PI/180;
      LON.push(Math.cos(t), Math.sin(t));
    }
  })();

  var N_LAT = LAT.length / 3, N_LON = LON.length / 2;

  /* 爆炸用的逐點固定資料：噴飛速度、散射方向、裂縫圖樣。

  var RND1 = new Float32Array(N_LAT * N_LON);
  var RND2 = new Float32Array(N_LAT * N_LON);
  var CRACK = new Float32Array(N_LAT * N_LON);
  (function seed(){
    var s = 20260809 >>> 0;
    var rnd = function(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
    for (var li = 0; li < N_LAT; li++){
      var lat = LAT[li*3 + 2];
      for (var lj = 0; lj < N_LON; lj++){
        var k = li * N_LON + lj;
        RND1[k] = rnd();
        RND2[k] = rnd();
        // 兩組不同頻率交疊出不規則的裂縫網，數值越小＝越靠近裂縫

  var RAMP = [];
  function rampFrom(stops, out){
    out.length = 0;
    for (var i = 0; i < LEVELS; i++){
      var t = i/(LEVELS-1) * (stops.length-1);
      var k = Math.min(stops.length-2, Math.floor(t));
      var f = t - k, a = stops[k], b = stops[k+1];

        Math.round(a[0]+(b[0]-a[0])*f) + ',' +
        Math.round(a[1]+(b[1]-a[1])*f) + ',' +
        Math.round(a[2]+(b[2]-a[2])*f) + ')');
    }
    return out;
  }

      off.width = iw; off.height = ih;

        for (var x = 0; x < iw; x++){
          var p = (y * iw + x) * 4;
          var luma = (d[p] * 0.30 + d[p+1] * 0.59 + d[p+2] * 0.11) / 92;
          if (luma > 1) luma = 1;
          var a = t > luma ? t : luma;               // 亮的留著，暗的淡出
          d[p+3] = (a * 255) | 0;
        }
      }
      oc.putImageData(img, 0, 0);
      return off;
    } catch (e){
      return null;
    }
  }

  function resize(){
    var w = cvs.clientWidth, h = cvs.clientHeight;
    if (w < 1 || h < 1) return false;   // 版面還沒量測到（分頁隱藏等），這次跳過

    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = w; H = h;
    cvs.width  = Math.round(W * DPR);
    cvs.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    R  = Math.max(W, H) * 1.42;
    cx = W * 0.5;
    cy = (H - H * ARC) + R;   // 球心遠在畫面下方，只露出上緣一道弧
    return true;
  }

  function drawStars(){
    var bandH = H * STAR_BAND;
    ctx.fillStyle = '#ffffff';
    for (var i = 0; i < STARS.length; i += 4){
      ctx.globalAlpha = STARS[i+3];
      ctx.beginPath();
      ctx.arc(STARS[i] * W, STARS[i+1] * bandH, STARS[i+2], 0, 6.28318530718);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawLattice(spin, bands, bt){
    var cs = Math.cos(spin), ss = Math.sin(spin);
    var minY = (cy - H) / R;
    if (minY < -1) minY = -1;

    // bt：0＝完好，1＝倒數歸零的瞬間，>1＝歸零後的餘燼擴散
    var b     = bt > 1 ? 1 : bt;
    var drift = bt > 1 ? (bt - 1) : 0;
    var spread = drift > 1.5 ? 1.5 : drift;             // 收斂擴散，讓殘骸留在畫面裡
    var blow  = (b * b) * 0.34 * H + spread * 0.13 * H; // 噴飛距離（螢幕高度為單位）
    var crackW = 0.05 + b * 0.62;                        // 裂縫隨時間變寬
    var cool  = 1 / (1 + drift * 0.5);                   // 餘燼逐漸變暗

    for (var i = 0; i < LAT.length; i += 3){
      var cla = LAT[i], sla = LAT[i+1];
      var band = bands ? (1 + bands * Math.sin(LAT[i+2] * 9.0)) : 1;
      var rowBase = (i / 3) * N_LON;

      for (var j = 0; j < LON.length; j += 2){
        // 繞自轉軸旋轉
        var x  = cla * LON[j];
        var z  = cla * LON[j+1];
        var xr =  x * cs + z * ss;
        var zr = -x * ss + z * cs;

        // 傾斜到視角座標
        var Y = sla * CA - zr * SA;
        var Z = sla * SA + zr * CA;
        if (Z <= 0.015) continue;      // 背面剔除
        var X = xr;

        // 地平線微傾
        var Xv = X * CR - Y * SR;
        var Yv = X * SR + Y * CR;
        if (Yv < minY) continue;       // 畫面外

        var sy = cy - R * Yv;
        var sx = cx + R * Xv;

        // 受光：Lambert
        var lam = X * LX + Y * LY + Z * LZ;
        if (lam < 0) lam = 0;

        // 邊緣光：越靠近輪廓（Z 越小）越亮
        var d = 1 - Z * Z;
        var rim = d * d * d * d;

        var v = (0.06 + 0.60 * Math.sqrt(lam) + 1.30 * rim * (0.20 + 0.80 * lam)) * band;
        var hot = false;

        if (bt > 0){
          var k  = rowBase + (j >> 1);
          var r1 = RND1[k], r2 = RND2[k];

          // 沿著「由球心向外」的方向噴飛，再加上亂向散射
          var push = blow * (0.30 + r1 * 1.15);
          var dx = sx - cx, dy = sy - cy;
          var len = Math.sqrt(dx*dx + dy*dy) || 1;
          sx += dx / len * push + (r1 - 0.5) * push * 0.65;
          sy += dy / len * push + (r2 - 0.5) * push * 0.65;

          // 裂縫先燒起來，之後範圍逐漸擴大到整顆
          hot = CRACK[k] < crackW || b > 0.55 + r2 * 0.45;
          if (hot) v = (v + 0.30 + b * 0.85) * cool;
          else     v = v * (1 - b * 0.55);
        }

        if (sy > H + 2 || sy < -2 || sx < -2 || sx > W + 2) continue;

        if (v > 1) v = 1; else if (v < 0) v = 0;

        ctx.fillStyle = (hot ? HOT : RAMP)[(v * (LEVELS - 1)) | 0];
        var s = 0.9 + v * 1.0;
        ctx.fillRect(sx, sy, s, s);
      }
    }
  }

  function render(spin, bt){
    var P = PLANETS[current];
    var b = bt > 1 ? 1 : bt;          // 0..1
    var alive = 1 - b;                 // 星球「完整度」

    ctx.save();

    // 爆炸時整個畫面震動（連星星一起，相對位置不變，不是星星自己在抖）
    if (b > 0 && !reduceMotion){
      var amp = b * b * 11;
      ctx.translate((Math.random() - 0.5) * amp, (Math.random() - 0.5) * amp);
    }

    // 太空底色（多畫一圈，避免震動時邊緣露出空白）
    var bg = ctx.createLinearGradient(0, 0, W * 0.35, H);
    bg.addColorStop(0, '#02040b');
    bg.addColorStop(0.6, '#03060f');
    bg.addColorStop(1, '#050a16');
    ctx.fillStyle = bg;
    ctx.fillRect(-24, -24, W + 48, H + 48);

    drawStars();

    // 地平線外緣：大氣輝光（爆炸時逐漸轉成火光）
    ctx.globalCompositeOperation = 'lighter';
    var halo = ctx.createRadialGradient(cx, cy, R * 0.985, cx, cy, R * 1.11);
    halo.addColorStop(0,    'rgba(' + P.halo + ',' + (0.36 * alive).toFixed(3) + ')');
    halo.addColorStop(0.26, 'rgba(' + P.halo + ',' + (0.17 * alive).toFixed(3) + ')');
    halo.addColorStop(0.60, 'rgba(' + P.halo + ',' + (0.06 * alive).toFixed(3) + ')');
    halo.addColorStop(1,    'rgba(' + P.halo + ',0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'source-over';

    var photo = (current === 'mars' && marsImg) ? marsImg : null;

    if (photo){
      // 實拍火星：圖片頂端對齊地平線，上方保留星空，UI 不會壓在亮面上
      if (alive > 0.01){
        var hy = H * (1 - ARC);
        var iw = photo.naturalWidth || photo.width;    // Image 或離屏 canvas 都相容
        var ih = photo.naturalHeight || photo.height;
        var psc = Math.max(W / iw, (H - hy + 4) / ih);
        var pw = iw * psc, ph = ih * psc;
        ctx.globalAlpha = alive;
        ctx.drawImage(photo, (W - pw) / 2, hy, pw, ph);
        ctx.globalAlpha = 1;
      }
      // 崩解時讓點陣碎片淡入，做出「實體炸成碎片」的交接
      if (bt > 0){
        ctx.globalAlpha = Math.min(1, b * 2.2);
        drawLattice(spin, P.bands, bt);
        ctx.globalAlpha = 1;
      }
    } else {
      // 星球本體（遮住背後的星星）；崩解時逐漸透出星空
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, 6.28318530718);
      var body = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R);
      body.addColorStop(0, P.body[0]);
      body.addColorStop(1, P.body[1]);
      ctx.globalAlpha = 1 - b * 0.88;
      ctx.fillStyle = body;
      ctx.fill();
      ctx.globalAlpha = 1;

      // 經緯粒子點陣。完好時裁切在球內；爆炸後不裁切，碎片才能飛出輪廓
      if (bt > 0){
        drawLattice(spin, P.bands, bt);
      } else {
        ctx.save();
        ctx.clip();
        drawLattice(spin, P.bands, 0);
        ctx.restore();
      }

      // 輪廓內側的邊緣光 + 左上受光處的散射亮斑
      if (alive > 0.02){
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, 6.28318530718);
        ctx.clip();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = alive;

        var limb = ctx.createRadialGradient(cx, cy, R * 0.955, cx, cy, R);
        limb.addColorStop(0, 'rgba(' + P.limb + ',0)');
        limb.addColorStop(1, 'rgba(' + P.limb + ',0.32)');
        ctx.fillStyle = limb;
        ctx.fillRect(0, 0, W, H);

        var lx = W * 0.22;
        var dx = lx - cx;
        var ly = cy - Math.sqrt(Math.max(0, R * R - dx * dx));
        var sun = ctx.createRadialGradient(lx, ly, 0, lx, ly, W * 0.6);
        sun.addColorStop(0,   'rgba(' + P.limb + ',0.20)');
        sun.addColorStop(0.4, 'rgba(' + P.limb + ',0.07)');
        sun.addColorStop(1,   'rgba(' + P.limb + ',0)');
        ctx.fillStyle = sun;
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
      }
    }

    // 火光與衝擊波畫在星球之上，崩解時才會蓋過表面
    if (b > 0){
      ctx.globalCompositeOperation = 'lighter';
      // 歸零後火光要退掉，否則畫面會一直留著一層橘霧
      var emb = b / (1 + (bt > 1 ? bt - 1 : 0) * 1.15);
      var fire = ctx.createRadialGradient(cx, cy, R * 0.90, cx, cy, R * 1.35);
      fire.addColorStop(0,    'rgba(255,116,26,' + (0.42 * emb).toFixed(3) + ')');
      fire.addColorStop(0.35, 'rgba(255,72,18,'  + (0.22 * emb).toFixed(3) + ')');
      fire.addColorStop(1,    'rgba(180,30,10,0)');
      ctx.fillStyle = fire;
      ctx.fillRect(0, 0, W, H);

      // 衝擊波：從地平線往外擴散
      if (bt > 0.72){
        var sw = (bt - 0.72) / 0.55;
        if (sw < 1.6){
          ctx.strokeStyle = 'rgba(255,214,150,' + (Math.max(0, 1 - sw / 1.6) * 0.55).toFixed(3) + ')';
          ctx.lineWidth = 2 + Math.max(0, 1 - sw) * 12;
          ctx.beginPath();
          ctx.arc(cx, cy, R + sw * H * 1.25, 0, 6.28318530718);
          ctx.stroke();
        }
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    ctx.restore();   // 解除震動位移

    // 歸零瞬間的爆閃（畫在 canvas 上，所以在文字下層，不會蓋掉倒數）
    var flash = 0;
    if (bt >= 0.94 && bt <= 1)      flash = (bt - 0.94) / 0.06 * 0.8;
    else if (bt > 1)                flash = Math.max(0, 0.8 * (1 - (bt - 1) / 1.1));
    if (flash > 0){
      var fg = ctx.createRadialGradient(cx, cy - R * 0.02, 0, cx, cy, R * 1.2);
      fg.addColorStop(0, 'rgba(255,246,226,' + flash.toFixed(3) + ')');
      fg.addColorStop(0.5, 'rgba(255,176,80,' + (flash * 0.7).toFixed(3) + ')');
      fg.addColorStop(1, 'rgba(255,110,30,0)');
      ctx.fillStyle = fg;
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* ───────── 計時器 ───────── */
  var TOTAL = PLANETS[current].minutes * 60 * 1000;
  var remaining = TOTAL;
  var running = false;
  var endAt = 0;

  var BOOM_MS = 12 * 1000;       // 最後 12 秒開始崩解
  var doneAt = 0;                // 倒數歸零的時間戳，用來延續爆炸後的畫面

  // 0＝完好；0→1＝最後三分鐘的崩解過程；>1＝歸零後每秒 +1 的餘波
  function boomPhase(){
    if (doneAt) return Math.min(6, 1 + (performance.now() - doneAt) / 1000);
    if (remaining >= BOOM_MS) return 0;
    return 1 - remaining / BOOM_MS;
  }

  var elClock  = document.getElementById('clock');
  var elStatus = document.getElementById('status');
  var elFill   = document.getElementById('fill');
  var elRocket = document.getElementById('rocket');
  var elTrack  = document.getElementById('track');
  var btnStart = document.getElementById('btnStart');
  var btnPause = document.getElementById('btnPause');
  var btnReset = document.getElementById('btnReset');

  function fmt(ms){
    var s = Math.ceil(ms / 1000);
    var m = Math.floor(s / 60);
    s = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  var lastText = '', lastPct = -1;

  function paintUI(){
    var text = fmt(remaining);
    if (text !== lastText){
      lastText = text;
      elClock.textContent = text;
      document.title = '任務計時器 · ' + PLANETS[current].label + ' ' + text;
    }

    var pct = Math.round((1 - remaining / TOTAL) * 1000) / 10;
    if (pct !== lastPct){
      lastPct = pct;
      elFill.style.width = pct + '%';
      elRocket.style.left = pct + '%';
      elTrack.setAttribute('aria-valuenow', Math.round(pct));
    }
  }

  function setStatus(t){ elStatus.textContent = t; }

  function syncButtons(){
    btnStart.disabled = running || remaining === 0;
    btnPause.disabled = !running;
    btnReset.disabled = !running && remaining === TOTAL;
  }

  function start(){
    if (running || remaining <= 0) return;
    endAt = performance.now() + remaining;
    running = true;
    doneAt = 0;
    document.body.classList.add('is-running');
    document.body.classList.remove('is-done');
    setStatus('飛行中');
    syncButtons();
  }

  function pause(){
    if (!running) return;
    remaining = Math.max(0, endAt - performance.now());
    running = false;
    document.body.classList.remove('is-running');
    setStatus('待機中');
    syncButtons();
  }

  function reset(msg){
    running = false;
    remaining = TOTAL;
    doneAt = 0;
    document.body.classList.remove('is-running', 'is-done');
    setStatus(msg || '已返航');
    lastText = ''; lastPct = -1;
    paintUI();
    syncButtons();
  }

  btnStart.addEventListener('click', start);
  btnPause.addEventListener('click', pause);
  btnReset.addEventListener('click', function(){ reset(); });

  document.addEventListener('keydown', function(e){
    if (e.code !== 'Space' || e.target !== document.body) return;
    e.preventDefault();
    running ? pause() : start();
  });

  function tickTimer(){
    if (running){
      remaining = endAt - performance.now();
      if (remaining <= 0){
        remaining = 0;
        running = false;
        if (!doneAt) doneAt = performance.now();
        document.body.classList.remove('is-running');
        document.body.classList.add('is-done');
        setStatus('已抵達 ' + PLANETS[current].label);
        syncButtons();
      }
    }
    paintUI();
  }

  /* ───────── 星球切換 ───────── */
  var chips = Array.prototype.slice.call(document.querySelectorAll('.chip'));

  function selectPlanet(key){
    if (!PLANETS[key] || key === current) return;
    current = key;
    buildRamp(PLANETS[key].ramp);
    chips.forEach(function(c){
      c.setAttribute('aria-selected', c.dataset.planet === key ? 'true' : 'false');
    });
    TOTAL = PLANETS[key].minutes * 60 * 1000;
    reset('目的地：' + PLANETS[key].label);   // 換目的地就回到發射台
  }

  chips.forEach(function(chip){
    chip.addEventListener('click', function(){ selectPlanet(chip.dataset.planet); });
  });

  /* ───────── 台北日出日落（Open-Meteo，免金鑰） ─────────
     整段獨立於計時器：拿不到資料只會讓這一行顯示「離線」，不影響其他功能 */
  (function loadSun(){
    var el = document.getElementById('sun');
    if (!el) return;

    var offline = function(){ el.textContent = '離線'; };

    if (typeof fetch !== 'function'){ offline(); return; }

    var url = 'https://api.open-meteo.com/v1/forecast'
            + '?latitude=25.03&longitude=121.56'
            + '&daily=sunrise,sunset&timezone=Asia/Taipei&forecast_days=1';

    // 沒有逾時機制的話，網路卡住會讓這行永遠空白
    var ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 8000) : 0;
    var done = function(){ if (timer) { clearTimeout(timer); timer = 0; } };

    // API 已用 timezone 參數回當地時間，取 T 後面的 HH:MM 即可
    var hhmm = function(v){
      var m = /T(\d{2}:\d{2})/.exec(String(v));
      return m ? m[1] : null;
    };

    fetch(url, ctrl ? { signal: ctrl.signal } : undefined)
      .then(function(res){
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(data){
        var d = data && data.daily;
        var rise = hhmm(d && d.sunrise && d.sunrise[0]);
        var set  = hhmm(d && d.sunset  && d.sunset[0]);
        if (!rise || !set) throw new Error('回傳欄位缺漏');
        el.textContent = '日出 ' + rise + ' ／ 日落 ' + set;
        done();
      })
      .catch(function(){ offline(); done(); });
  })();

  /* ───────── 主迴圈 ───────── */
  var t0 = performance.now();

  function frame(now){
    if (W >= 1 || resize()){
      var sp = PLANETS[current].spin;
      render(reduceMotion ? 0.6 : 0.6 + (now - t0) * sp, boomPhase());
    }
    requestAnimationFrame(frame);
  }

  // 計時獨立於繪製：分頁隱藏時 rAF 會暫停，倒數不能跟著停
  setInterval(tickTimer, 250);
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) tickTimer();
  });

  if (typeof ResizeObserver === 'function'){
    new ResizeObserver(function(){ resize(); }).observe(cvs);
  } else {
    var resizeTimer = 0;
    window.addEventListener('resize', function(){
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resize, 80);
    });
  }

  resize();
  paintUI();
  syncButtons();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
